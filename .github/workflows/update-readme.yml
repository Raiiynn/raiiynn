name: Update profile statistics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - template.md
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_USER_TOKEN: ${{ secrets.USER_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const username = context.repo.owner;
            const hasUserToken = process.env.HAS_USER_TOKEN === 'true';

            const repositories = hasUserToken
              ? await github.paginate(
                  github.rest.repos.listForAuthenticatedUser,
                  { affiliation: 'owner', visibility: 'all', per_page: 100 }
                )
              : await github.paginate(
                  github.rest.repos.listForUser,
                  { username, type: 'owner', per_page: 100 }
                );

            const [commits, issues, contributions] = await Promise.all([
              github.request('GET /search/commits', {
                q: `author:${username}`,
                per_page: 1
              }),
              github.rest.search.issuesAndPullRequests({
                q: `author:${username} type:issue`,
                per_page: 1
              }),
              github.graphql(`
                query($login: String!) {
                  user(login: $login) {
                    repositoriesContributedTo(
                      first: 1
                      contributionTypes: [COMMIT]
                      includeUserRepositories: false
                    ) {
                      totalCount
                    }
                  }
                }
              `, { login: username })
            ]);

            const stats = {
              '{{ REPOSITORIES }}': repositories.length,
              '{{ REPOSITORIES_CONTRIBUTED_TO }}': contributions.user.repositoriesContributedTo.totalCount,
              '{{ COMMITS }}': commits.data.total_count,
              '{{ ISSUES }}': issues.data.total_count,
              '{{ STARS }}': repositories.reduce(
                (total, repository) => total + repository.stargazers_count,
                0
              )
            };

            let readme = fs.readFileSync('template.md', 'utf8');
            for (const [placeholder, value] of Object.entries(stats)) {
              readme = readme.split(placeholder).join(String(value));
            }
            fs.writeFileSync('README.md', readme);

      - name: Commit updated statistics
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update profile statistics"
            git push
          fi
