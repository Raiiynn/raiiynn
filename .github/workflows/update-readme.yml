name: Update profile statistics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - template.md
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USER_TOKEN: ${{ secrets.USER_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README
        if: ${{ env.USER_TOKEN != '' }}
        uses: tarunesh1234/profile-readme-stats-mod@v1.2.0
        with:
          token: ${{ env.USER_TOKEN }}
          template: ./template.md
          readme: ./README.md
          includeForks: true

      - name: Report missing token
        if: ${{ env.USER_TOKEN == '' }}
        run: echo "::notice::Add the USER_TOKEN repository secret to enable profile statistics."

      - name: Commit updated statistics
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update profile statistics"
            git push
          fi
